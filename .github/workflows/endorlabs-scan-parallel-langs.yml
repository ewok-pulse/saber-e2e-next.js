    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      id-token: write
      security-events: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24" # detected from existing CI workflow
      - run: npm install -g pnpm
      - run: pnpm install --frozen-lockfile
      - uses: endorlabs/github-action@f46ffb04c928a9c9c356f9627bd60b710ed0963e
        with:
          namespace: "endor-solutions-ypulse.github-ci.saber-e2e"
          scan_dependencies: true
          pr: true
          enable_pr_comments: true
          github_token: ${{ secrets.GITHUB_TOKEN }}
          enable_github_action_token: true
          additional_args: "--languages=javascript,typescript --include-path=examples/** --exclude-path=test/** --exclude-path=turbopack/crates/turbopack-tests/** --exclude-path=packages/next-codemod/lib/__tests__/** --exclude-path=turbopack/crates/turbopack-core/tests/** --exclude-path=turbopack/crates/turbopack-tracing/tests/** --exclude-path=turbopack/packages/turbo-tracing-next-plugin/test/** --quick-scan"
    env:
      # Saber set this because typescript ≥4.9 was detected — enables deep reachability via tsserver.
      ENDOR_JS_ENABLE_TSSERVER: "true"
      # Raise this (e.g. 1200) if your scan times out during tsserver — large or unusually-structured TS repos may need more.
      ENDOR_JS_TSSERVER_TIMEOUT: "600"
