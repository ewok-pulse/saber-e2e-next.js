              - '**/package.json'
              - '**/package-lock.json'
              - '**/yarn.lock'
              - '**/pnpm-lock.yaml'
              - '**/rush.json'
              - '**/*.js'
              - '**/*.ts'
              - '**/*.tsx'
            rust-turbopack:
              - turbopack/**/'**/Cargo.toml'
              - turbopack/**/'**/Cargo.lock'
              - turbopack/**/'**/*.rs'
            rust-crates:
              - crates/**/'**/Cargo.toml'
              - crates/**/'**/Cargo.lock'
              - crates/**/'**/*.rs'
            rust-rspack:
