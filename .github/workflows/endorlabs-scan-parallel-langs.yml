name: Endor Labs Scan
on:
  push:
    branches: [ canary ]
  pull_request:
    branches: [ canary ]
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
jobs:
  detect-changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      pull-requests: read
    outputs:
      javascript-typescript-examples: ${{ steps.filter.outputs.javascript-typescript-examples }}
      javascript-typescript-packages: ${{ steps.filter.outputs.javascript-typescript-packages }}
      javascript-typescript-evals: ${{ steps.filter.outputs.javascript-typescript-evals }}
      javascript-typescript-bench: ${{ steps.filter.outputs.javascript-typescript-bench }}
      javascript-typescript-crates: ${{ steps.filter.outputs.javascript-typescript-crates }}
      javascript-typescript-turbopack: ${{ steps.filter.outputs.javascript-typescript-turbopack }}
      javascript-typescript-github: ${{ steps.filter.outputs.javascript-typescript-github }}
      javascript-typescript-other: ${{ steps.filter.outputs.javascript-typescript-other }}
      rust-turbopack: ${{ steps.filter.outputs.rust-turbopack }}
      rust-crates: ${{ steps.filter.outputs.rust-crates }}
      rust-rspack: ${{ steps.filter.outputs.rust-rspack }}
      rust-scripts: ${{ steps.filter.outputs.rust-scripts }}
      rust-root: ${{ steps.filter.outputs.rust-root }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |-
            javascript-typescript-examples:
              - examples/**/'**/package.json'
              - examples/**/'**/package-lock.json'
              - examples/**/'**/yarn.lock'
              - examples/**/'**/pnpm-lock.yaml'
              - examples/**/'**/rush.json'
              - examples/**/'**/*.js'
              - examples/**/'**/*.ts'
              - examples/**/'**/*.tsx'
            javascript-typescript-packages:
              - packages/**/'**/package.json'
              - packages/**/'**/package-lock.json'
              - packages/**/'**/yarn.lock'
              - packages/**/'**/pnpm-lock.yaml'
              - packages/**/'**/rush.json'
              - packages/**/'**/*.js'
              - packages/**/'**/*.ts'
              - packages/**/'**/*.tsx'
            javascript-typescript-evals:
              - evals/**/'**/package.json'
              - evals/**/'**/package-lock.json'
              - evals/**/'**/yarn.lock'
              - evals/**/'**/pnpm-lock.yaml'
              - evals/**/'**/rush.json'
              - evals/**/'**/*.js'
              - evals/**/'**/*.ts'
              - evals/**/'**/*.tsx'
            javascript-typescript-bench:
              - bench/**/'**/package.json'
              - bench/**/'**/package-lock.json'
              - bench/**/'**/yarn.lock'
