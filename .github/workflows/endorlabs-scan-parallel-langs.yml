              - crates/**/'**/package-lock.json'
              - crates/**/'**/yarn.lock'
              - crates/**/'**/pnpm-lock.yaml'
              - crates/**/'**/rush.json'
              - crates/**/'**/*.js'
              - crates/**/'**/*.ts'
              - crates/**/'**/*.tsx'
            javascript-typescript-turbopack:
              - turbopack/**/'**/package.json'
              - turbopack/**/'**/package-lock.json'
              - turbopack/**/'**/yarn.lock'
              - turbopack/**/'**/pnpm-lock.yaml'
              - turbopack/**/'**/rush.json'
              - turbopack/**/'**/*.js'
              - turbopack/**/'**/*.ts'
              - turbopack/**/'**/*.tsx'
            javascript-typescript-github:
              - .github/**/'**/package.json'
              - .github/**/'**/package-lock.json'
              - .github/**/'**/yarn.lock'
              - .github/**/'**/pnpm-lock.yaml'
